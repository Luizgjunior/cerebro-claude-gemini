<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Dashboard — Cérebro Único</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: #484f58; }

  /* Cursor pulsante durante streaming */
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.1} }
  .cursor-blink { animation: blink 0.8s infinite; color: #58a6ff; margin-left: 1px; }

  /* Status dots */
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot-green { background: #3fb950; box-shadow: 0 0 6px #3fb95066; }
  .dot-red   { background: #f85149; }
  .dot-yellow{ background: #d29922; }

  /* Painéis */
  .panel { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .panel-header {
    height: 40px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    background: #161b22;
    border-bottom: 1px solid #21262d;
    flex-shrink: 0;
    gap: 8px;
  }
  .chat-history {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .chat-input-area {
    padding: 10px;
    border-top: 1px solid #21262d;
    background: #161b22;
    flex-shrink: 0;
  }

  /* Mensagens */
  .msg-user {
    display: flex;
    justify-content: flex-end;
  }
  .msg-user-bubble {
    max-width: 75%;
    background: #1f6feb33;
    border: 1px solid #1f6feb55;
    border-radius: 12px 12px 4px 12px;
    padding: 8px 12px;
    font-size: 13px;
    color: #c9d1d9;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg-agent {
    display: flex;
    justify-content: flex-start;
  }
  .msg-agent-bubble {
    max-width: 90%;
    width: 100%;
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 4px 12px 12px 12px;
    padding: 10px 12px;
    font-size: 13px;
    color: #c9d1d9;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.6;
  }
  .msg-agent-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 5px;
    text-transform: uppercase;
  }
  .msg-error-bubble {
    background: #f8514920;
    border: 1px solid #f8514950;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    color: #f85149;
    margin-top: 4px;
    font-family: monospace;
  }

  /* Code blocks nas respostas */
  .msg-agent-bubble code {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 4px;
    padding: 1px 5px;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 12px;
    color: #79c0ff;
  }
  .msg-agent-bubble pre {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 10px;
    overflow-x: auto;
    margin: 8px 0;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 12px;
    color: #e6edf3;
    line-height: 1.5;
  }

  /* Inputs */
  .chat-textarea {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #c9d1d9;
    font-size: 13px;
    resize: none;
    outline: none;
    padding: 8px 12px;
    width: 100%;
    font-family: inherit;
    line-height: 1.5;
    transition: border-color 0.15s;
  }
  .chat-textarea:focus { border-color: #58a6ff; }
  .chat-textarea::placeholder { color: #484f58; }

  /* Botões */
  .btn {
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
    align-self: flex-end;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-claude { background: #da7633; color: white; }
  .btn-claude:hover:not(:disabled) { background: #e8864a; }
  .btn-gemini { background: #1f6feb; color: white; }
  .btn-gemini:hover:not(:disabled) { background: #388bfd; }
  .btn-both   { background: #6e40c9; color: white; padding: 8px 24px; font-size: 13px; }
  .btn-both:hover:not(:disabled) { background: #8957e5; }
  .btn-clear  { background: transparent; border: 1px solid #30363d; color: #8b949e;
                padding: 4px 8px; font-size: 11px; }
  .btn-clear:hover { background: #21262d; color: #c9d1d9; }

  /* Sidebar */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: #0d1117;
    border-left: 1px solid #21262d;
    overflow: hidden;
  }
  .sidebar-content {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .sidebar-section-title {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #484f58;
    margin-bottom: 6px;
  }
  .sidebar-value {
    font-size: 12px;
    color: #8b949e;
    line-height: 1.5;
    word-break: break-word;
  }
  .sidebar-goal {
    font-size: 11px;
    color: #8b949e;
    padding: 3px 0;
    border-bottom: 1px solid #21262d22;
    line-height: 1.4;
  }
  .log-entry {
    font-size: 10px;
    font-family: 'Cascadia Code', monospace;
    color: #484f58;
    padding: 2px 0;
    border-bottom: 1px solid #21262d11;
    word-break: break-all;
  }
  .log-entry span { color: #3fb950; }

  /* Barra inferior "Enviar para Ambos" */
  .both-bar {
    height: 56px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    border-top: 1px solid #21262d;
    background: #161b22;
    flex-shrink: 0;
  }

  /* Header */
  .main-header {
    height: 44px;
    background: #161b22;
    border-bottom: 1px solid #21262d;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    flex-shrink: 0;
  }

  /* Divisor entre painéis */
  .divider { width: 1px; background: #21262d; flex-shrink: 0; }

  /* Thinking indicator */
  .thinking { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
  .thinking span {
    width: 5px; height: 5px; border-radius: 50%; background: #484f58;
    animation: thinking 1.2s infinite;
  }
  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes thinking { 0%,60%,100%{transform:scale(1);opacity:.4} 30%{transform:scale(1.3);opacity:1} }

  /* Status bar texto */
  .status-text {
    font-size: 11px;
    color: #484f58;
    font-style: italic;
    padding: 2px 0;
  }
</style>
</head>
<body class="flex flex-col">

<!-- ── HEADER ──────────────────────────────────────────────────── -->
<header class="main-header">
  <span style="color:#58a6ff;font-size:13px;font-weight:700;letter-spacing:.05em">NEXUS DASHBOARD</span>
  <span style="color:#21262d">│</span>
  <div style="display:flex;align-items:center;gap:6px">
    <div class="dot dot-green" id="nexus-dot"></div>
    <span style="font-size:11px;color:#8b949e" id="nexus-status">NexusSync :7700</span>
  </div>
  <span style="color:#21262d">│</span>
  <span style="font-size:11px;color:#8b949e" id="header-project"></span>
  <div style="margin-left:auto;font-size:11px;color:#484f58;font-variant-numeric:tabular-nums" id="header-clock"></div>
</header>

<!-- ── MAIN ────────────────────────────────────────────────────── -->
<div style="flex:1;display:flex;overflow:hidden;min-height:0">

  <!-- PAINEL CLAUDE -->
  <div class="panel">
    <div class="panel-header">
      <div class="dot dot-green" id="claude-dot" style="background:#da7633;box-shadow:0 0 5px #da763355"></div>
      <span style="font-size:11px;font-weight:700;color:#da7633;letter-spacing:.08em">CLAUDE CODE</span>
      <div id="claude-status" class="status-text" style="margin-left:4px"></div>
      <button class="btn btn-clear" style="margin-left:auto" onclick="clearPanel('claude')">Limpar</button>
    </div>
    <div class="chat-history" id="claude-history"></div>
    <div class="chat-input-area">
      <div style="display:flex;gap:8px;align-items:flex-end">
        <textarea class="chat-textarea" id="claude-input" rows="3"
          placeholder="Mensagem para Claude... (Enter envia, Shift+Enter nova linha)"></textarea>
        <button class="btn btn-claude" id="claude-send-btn" onclick="sendMessage('claude')">Enviar →</button>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- PAINEL GEMINI -->
  <div class="panel">
    <div class="panel-header">
      <div class="dot dot-green" id="gemini-dot"></div>
      <span style="font-size:11px;font-weight:700;color:#58a6ff;letter-spacing:.08em">GEMINI CLI</span>
      <div id="gemini-status" class="status-text" style="margin-left:4px"></div>
      <button class="btn btn-clear" style="margin-left:auto" onclick="clearPanel('gemini')">Limpar</button>
    </div>
    <div class="chat-history" id="gemini-history"></div>
    <div class="chat-input-area">
      <div style="display:flex;gap:8px;align-items:flex-end">
        <textarea class="chat-textarea" id="gemini-input" rows="3"
          placeholder="Mensagem para Gemini... (Enter envia, Shift+Enter nova linha)"></textarea>
        <button class="btn btn-gemini" id="gemini-send-btn" onclick="sendMessage('gemini')">Enviar →</button>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- SIDEBAR NEXUS BRAIN -->
  <div class="sidebar">
    <div class="panel-header">
      <span style="font-size:10px;font-weight:700;color:#484f58;letter-spacing:.12em">NEXUS BRAIN</span>
      <span style="font-size:10px;color:#484f58;margin-left:auto" id="sidebar-refresh-time"></span>
    </div>
    <div class="sidebar-content" id="nexus-sidebar">
      <div style="color:#484f58;font-size:12px">Carregando...</div>
    </div>
    <div style="padding:8px 14px;border-top:1px solid #21262d">
      <span style="font-size:10px;color:#30363d">Auto-refresh 5s</span>
    </div>
  </div>

</div>

<!-- ── BARRA ENVIAR PARA AMBOS ──────────────────────────────────── -->
<div class="both-bar">
  <span style="font-size:11px;color:#484f58;white-space:nowrap;flex-shrink:0">Para ambos:</span>
  <textarea class="chat-textarea" id="both-input" rows="1"
    placeholder="Enviar a mesma mensagem para Claude e Gemini simultaneamente..."
    style="height:36px;padding:6px 12px"></textarea>
  <button class="btn btn-both" id="both-send-btn" onclick="sendToBoth()">⚡ Enviar para Ambos</button>
</div>

<!-- ── JAVASCRIPT ───────────────────────────────────────────────── -->
<script>
// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
const ws = { claude: null, gemini: null };
const sending = { claude: false, gemini: false };
const activeConvs = {}; // convId -> { agent, contentEl, buffer }

const COLORS = {
  claude: { label: '#da7633', border: '#da763322' },
  gemini: { label: '#58a6ff', border: '#58a6ff22' },
};

// ═══════════════════════════════════════════════════════════════
// WEBSOCKET
// ═══════════════════════════════════════════════════════════════
function connectWS(agent) {
  const url = `ws://localhost:8080/ws/${agent}`;
  const sock = new WebSocket(url);

  sock.onopen = () => {
    ws[agent] = sock;
    setDot(agent, 'green');
    setStatus(agent, '');
    setSendBtn(agent, false);
  };

  sock.onmessage = (evt) => {
    try { handleMsg(agent, JSON.parse(evt.data)); }
    catch { /* ignore */ }
  };

  sock.onclose = () => {
    ws[agent] = null;
    setDot(agent, 'red');
    setStatus(agent, 'Reconectando...');
    setSendBtn(agent, true);
    setTimeout(() => connectWS(agent), 3000);
  };

  sock.onerror = () => sock.close();
}

// ═══════════════════════════════════════════════════════════════
// MESSAGE HANDLER
// ═══════════════════════════════════════════════════════════════
function handleMsg(agent, msg) {
  const { type, content, conversation_id: convId } = msg;

  if (type === 'status') {
    setStatus(agent, content);
    // Mostra "pensando" na bolha se já existir
    const conv = activeConvs[convId];
    if (conv) showThinking(conv.contentEl.parentElement);
    return;
  }

  if (type === 'token') {
    const conv = activeConvs[convId];
    if (!conv) return;
    // Remove thinking indicator se presente
    hideThinking(conv.contentEl.parentElement);
    // Remove cursor pulsante
    const cursor = conv.contentEl.querySelector('.cursor-blink');
    if (cursor) cursor.remove();
    // Acumula no buffer
    conv.buffer += content;
    // Renderiza
    conv.contentEl.textContent = conv.buffer;
    // Re-adiciona cursor
    const c = document.createElement('span');
    c.className = 'cursor-blink';
    c.textContent = '▌';
    conv.contentEl.appendChild(c);
    scrollToBottom(agent);
    return;
  }

  if (type === 'done') {
    const conv = activeConvs[convId];
    if (conv) {
      hideThinking(conv.contentEl.parentElement);
      const cursor = conv.contentEl.querySelector('.cursor-blink');
      if (cursor) cursor.remove();
      // Renderiza markdown básico
      renderMarkdown(conv.contentEl);
      delete activeConvs[convId];
    }
    setStatus(agent, '');
    setSendBtn(agent, false);
    sending[agent] = false;
    return;
  }

  if (type === 'error') {
    const conv = activeConvs[convId];
    if (conv) {
      hideThinking(conv.contentEl.parentElement);
      const cursor = conv.contentEl.querySelector('.cursor-blink');
      if (cursor) cursor.remove();
      const errEl = document.createElement('div');
      errEl.className = 'msg-error-bubble';
      errEl.textContent = 'Erro: ' + content;
      conv.contentEl.parentElement.appendChild(errEl);
      delete activeConvs[convId];
    }
    setStatus(agent, '');
    setSendBtn(agent, false);
    sending[agent] = false;
    return;
  }
}

// ═══════════════════════════════════════════════════════════════
// SEND
// ═══════════════════════════════════════════════════════════════
function sendMessage(agent) {
  const inputEl = document.getElementById(`${agent}-input`);
  const text = inputEl.value.trim();
  if (!text || sending[agent]) return;

  const sock = ws[agent];
  if (!sock || sock.readyState !== WebSocket.OPEN) {
    setStatus(agent, 'Desconectado — aguarde reconexão');
    return;
  }

  const convId = crypto.randomUUID();
  inputEl.value = '';
  inputEl.style.height = '';

  // Mensagem do usuário
  appendUserMsg(agent, text);

  // Container da resposta
  const contentEl = appendAgentMsg(agent, convId);
  activeConvs[convId] = { agent, contentEl, buffer: '' };

  sending[agent] = true;
  setSendBtn(agent, true);

  sock.send(JSON.stringify({ type: 'prompt', content: text, conversation_id: convId }));
}

function sendToBoth() {
  const text = document.getElementById('both-input').value.trim();
  if (!text) return;
  document.getElementById('both-input').value = '';

  // Injeta nos inputs e envia
  ['claude', 'gemini'].forEach((agent, i) => {
    const el = document.getElementById(`${agent}-input`);
    el.value = text;
    setTimeout(() => sendMessage(agent), i * 50);
  });
}

// ═══════════════════════════════════════════════════════════════
// DOM HELPERS
// ═══════════════════════════════════════════════════════════════
function appendUserMsg(agent, text) {
  const hist = document.getElementById(`${agent}-history`);
  const div = document.createElement('div');
  div.className = 'msg-user';
  div.innerHTML = `<div class="msg-user-bubble">${escHtml(text)}</div>`;
  hist.appendChild(div);
  scrollToBottom(agent);
}

function appendAgentMsg(agent, convId) {
  const hist = document.getElementById(`${agent}-history`);
  const color = COLORS[agent].label;
  const label = agent === 'claude' ? 'CLAUDE' : 'GEMINI';

  const wrapper = document.createElement('div');
  wrapper.className = 'msg-agent';
  wrapper.id = `conv-${convId}`;

  const bubble = document.createElement('div');
  bubble.className = 'msg-agent-bubble';
  bubble.style.borderColor = COLORS[agent].border;

  const lbl = document.createElement('div');
  lbl.className = 'msg-agent-label';
  lbl.style.color = color;
  lbl.textContent = label;

  const content = document.createElement('div');
  content.id = `content-${convId}`;
  // Cursor inicial
  const cursor = document.createElement('span');
  cursor.className = 'cursor-blink';
  cursor.textContent = '▌';
  content.appendChild(cursor);

  bubble.appendChild(lbl);
  bubble.appendChild(content);
  wrapper.appendChild(bubble);
  hist.appendChild(wrapper);
  scrollToBottom(agent);

  return content;
}

function showThinking(bubble) {
  if (bubble.querySelector('.thinking')) return;
  const t = document.createElement('div');
  t.className = 'thinking';
  t.innerHTML = '<span></span><span></span><span></span>';
  bubble.appendChild(t);
}

function hideThinking(bubble) {
  const t = bubble.querySelector('.thinking');
  if (t) t.remove();
}

function scrollToBottom(agent) {
  const hist = document.getElementById(`${agent}-history`);
  hist.scrollTop = hist.scrollHeight;
}

function clearPanel(agent) {
  document.getElementById(`${agent}-history`).innerHTML = '';
}

function setDot(agent, color) {
  const dot = document.getElementById(`${agent}-dot`);
  if (!dot) return;
  dot.className = `dot dot-${color}`;
}

function setStatus(agent, text) {
  const el = document.getElementById(`${agent}-status`);
  if (el) el.textContent = text;
}

function setSendBtn(agent, disabled) {
  const btn = document.getElementById(`${agent}-send-btn`);
  if (btn) btn.disabled = disabled;
}

// ═══════════════════════════════════════════════════════════════
// MARKDOWN SIMPLES
// ═══════════════════════════════════════════════════════════════
function renderMarkdown(el) {
  let text = el.textContent;
  if (!text.trim()) return;

  // Escapa HTML primeiro
  let html = escHtml(text);

  // Blocos de código (```lang\n...\n```)
  html = html.replace(/```[\w]*\n?([\s\S]*?)```/g, (_, code) =>
    `<pre>${code.trim()}</pre>`
  );
  // Código inline
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Negrito
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Itálico
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Quebras de linha
  html = html.replace(/\n/g, '<br>');

  el.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════
// NEXUS SIDEBAR
// ═══════════════════════════════════════════════════════════════
async function refreshNexus() {
  try {
    const r = await fetch('/api/state');
    if (!r.ok) throw new Error('offline');
    const data = await r.json();
    renderSidebar(data);
    setNexusDot(true);
    document.getElementById('sidebar-refresh-time').textContent =
      new Date().toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  } catch {
    setNexusDot(false);
  }
}

function renderSidebar(state) {
  const el = document.getElementById('nexus-sidebar');

  const project = state.project || '—';
  const status  = state.status  || '—';
  const ctx     = (state.context || '—').slice(0, 300);
  const goals   = (state.goals   || []).slice(-5);
  const log     = (state.sync_log|| []).slice(-8).reverse();

  // Goals HTML
  const goalsHtml = goals.length
    ? goals.map(g => `<div class="sidebar-goal">• ${escHtml(String(g).slice(0,80))}</div>`).join('')
    : '<div class="sidebar-goal" style="color:#30363d">Nenhum</div>';

  // Log HTML
  const logHtml = log.length
    ? log.map(e => `<div class="log-entry"><span>[${e.agent||'?'}]</span> ${escHtml(String(e.key||''))}=${escHtml(String(e.value||'').slice(0,40))}</div>`).join('')
    : '<div class="log-entry" style="color:#30363d">Vazio</div>';

  // Mensagens pendentes
  const msgs_claude = (state.messages?.to_claude || []).length;
  const msgs_gemini = (state.messages?.to_gemini || []).length;
  const msgsHtml = (msgs_claude + msgs_gemini > 0)
    ? `<div style="font-size:11px;color:#d29922">
         ${msgs_claude > 0 ? `📬 ${msgs_claude} msg(s) para Claude<br>` : ''}
         ${msgs_gemini > 0 ? `📬 ${msgs_gemini} msg(s) para Gemini` : ''}
       </div>`
    : '';

  el.innerHTML = `
    <div>
      <div class="sidebar-section-title">Status</div>
      <div class="sidebar-value" style="color:#3fb950">${escHtml(status)}</div>
    </div>
    <div>
      <div class="sidebar-section-title">Projeto</div>
      <div class="sidebar-value" style="color:#c9d1d9;font-weight:600">${escHtml(project)}</div>
    </div>
    <div>
      <div class="sidebar-section-title">Contexto</div>
      <div class="sidebar-value">${escHtml(ctx)}</div>
    </div>
    <div>
      <div class="sidebar-section-title">Objetivos (${goals.length})</div>
      ${goalsHtml}
    </div>
    ${msgsHtml}
    <div>
      <div class="sidebar-section-title">Sync Log</div>
      ${logHtml}
    </div>
    <div style="border-top:1px solid #21262d;padding-top:10px">
      <div class="sidebar-section-title">Última sync</div>
      <div style="font-size:10px;color:#484f58;font-family:monospace">
        ${escHtml(state.last_update || '—')}<br>
        por <span style="color:#8b949e">${escHtml(state.last_agent || '—')}</span>
      </div>
    </div>
  `;

  document.getElementById('header-project').textContent = project !== '—' ? project : '';
}

function setNexusDot(online) {
  const dot  = document.getElementById('nexus-dot');
  const text = document.getElementById('nexus-status');
  if (dot)  dot.className = `dot ${online ? 'dot-green' : 'dot-red'}`;
  if (text) text.textContent = online ? 'NexusSync :7700 OK' : 'NexusSync OFFLINE';
}

// ═══════════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════════
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// Auto-resize textareas
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  // Teclado — Enter envia, Shift+Enter nova linha
  ['claude', 'gemini'].forEach(agent => {
    const inp = document.getElementById(`${agent}-input`);
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(agent); }
    });
    inp.addEventListener('input', () => autoResize(inp));
  });

  const bothInp = document.getElementById('both-input');
  bothInp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendToBoth(); }
  });

  // Relógio
  function updateClock() {
    document.getElementById('header-clock').textContent =
      new Date().toLocaleTimeString('pt-BR');
  }
  updateClock();
  setInterval(updateClock, 1000);

  // Conecta WebSockets
  connectWS('claude');
  connectWS('gemini');

  // NexusSync polling
  refreshNexus();
  setInterval(refreshNexus, 5000);

  // Mensagem de boas-vindas em ambos os painéis
  setTimeout(() => {
    ['claude', 'gemini'].forEach(agent => {
      const hist = document.getElementById(`${agent}-history`);
      const div = document.createElement('div');
      div.className = 'msg-agent';
      const color = COLORS[agent].label;
      const label = agent === 'claude' ? 'CLAUDE CODE' : 'GEMINI CLI';
      div.innerHTML = `
        <div class="msg-agent-bubble" style="border-color:${COLORS[agent].border};opacity:.6">
          <div class="msg-agent-label" style="color:${color}">${label}</div>
          <div style="font-size:12px;color:#484f58">
            Conectado via NexusSync Bridge. Digite uma mensagem para começar.
          </div>
        </div>`;
      hist.appendChild(div);
    });
  }, 800);
});
</script>
</body>
</html>
